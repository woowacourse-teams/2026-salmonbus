version: 0.2

env:
  shell: bash
  variables:
    WEBPACK_SENTRY_DSN: "https://82d47f0abddcf3d5a67454615589b0c6@o4512242355535872.ingest.us.sentry.io/4512242363596800"
    SENTRY_ORG: "salmonbus-org"
    SENTRY_PROJECT: "salmonbus-fe"

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - corepack enable
  pre_build:
    commands:
      # Amplitude 키 없이 빌드하면 운영에서 행동 이벤트가 하나도 쌓이지 않으므로 배포 전에 멈춘다
      - test -n "$WEBPACK_AMPLITUDE_API_KEY"
      # 인증 토큰은 CodeBuild의 비밀 환경변수로 설정한다. 값은 로그에 출력하지 않는다. 소스맵을 올리는 환경에서만 필요하다
      - if [ "$SENTRY_UPLOAD_SOURCEMAPS" = "true" ]; then test -n "$SENTRY_AUTH_TOKEN"; fi
      # 배포 경로, 무효화 대상, Sentry 환경, 소스맵 업로드 여부는 운영과 dev가 달라서 CodeBuild 프로젝트 환경변수로 받는다. 비었거나 정해진 값이 아니면 배포 전에 멈춘다
      - test -n "$S3_BASE"
      - test -n "$CLOUDFRONT_DISTRIBUTION_ID"
      - test "$WEBPACK_SENTRY_ENVIRONMENT" = "production" || test "$WEBPACK_SENTRY_ENVIRONMENT" = "development"
      - test "$SENTRY_UPLOAD_SOURCEMAPS" = "true" || test "$SENTRY_UPLOAD_SOURCEMAPS" = "false"
      - cd "${CODEBUILD_SRC_DIR}/frontend"
      - pnpm install --frozen-lockfile
      - pnpm typecheck
      - pnpm lint
      - pnpm test
  build:
    commands:
      - cd "${CODEBUILD_SRC_DIR}/frontend"
      - export APP_VERSION="$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7)"
      - pnpm build
  post_build:
    commands:
      # build가 실패해도 post_build는 실행되므로 아래 라인이 배포를 막는 역할을 한다
      - test "$CODEBUILD_BUILD_SUCCEEDING" = "1"
      - cd "${CODEBUILD_SRC_DIR}/frontend"
      - APP_VERSION="$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7)"
      # 업로드 순서 (SAL-100 결정2): assets → releases 사본 → index.html → CloudFront 무효화
      - aws s3 sync dist/assets "${S3_BASE}/assets" --exclude "*.map" --cache-control "public, max-age=31536000, immutable"
      - aws s3 cp "dist/index.html" "${S3_BASE}/releases/index-${APP_VERSION}.html" --cache-control "no-cache" --content-type "text/html"
      - aws s3 cp "dist/index.html" "${S3_BASE}/index.html" --cache-control "no-cache" --content-type "text/html"
      - aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
