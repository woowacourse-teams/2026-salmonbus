name: DOMAIN-WIKI-UPDATE

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      review_run_id:
        description: 검토 댓글에 표시된 실행 번호
        required: true
        type: string
      base_sha:
        description: 검토 대상 이전 커밋 SHA
        required: true
        type: string
      head_sha:
        description: 검토 대상 머지 커밋 SHA
        required: true
        type: string
      approval_digest:
        description: 검토 댓글의 승인값
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: domain-wiki-update
  cancel-in-progress: false

jobs:
  review:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      PYTHONPATH: tools/domain-wiki
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Clone Git Wiki without writing
        env:
          REPOSITORY: ${{ github.repository }}
        run: git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.wiki.git" .domain-wiki/wiki
      - name: Find the merged PR and discussion
        id: context
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          mkdir -p .domain-wiki
          gh api "repos/${REPOSITORY}/commits/${SHA}/pulls" > .domain-wiki/pulls.json
          jq '[.[] | select(.merged_at != null and .base.ref == "dev")][0] // {}' .domain-wiki/pulls.json > .domain-wiki/pr-full.json
          jq '{title: (.title // ""), body: (.body // ""), number: .number, url: .html_url}' .domain-wiki/pr-full.json > .domain-wiki/pr.json
          number="$(jq -r '.number // empty' .domain-wiki/pr-full.json)"
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          if [[ -n "$number" ]]; then
            gh api --paginate --slurp "repos/${REPOSITORY}/issues/${number}/comments" | jq 'add' > .domain-wiki/issue-comments.json
            gh api --paginate --slurp "repos/${REPOSITORY}/pulls/${number}/comments" | jq 'add' > .domain-wiki/review-comments.json
            gh api --paginate --slurp "repos/${REPOSITORY}/pulls/${number}/reviews" | jq 'add' > .domain-wiki/reviews.json
            jq -s 'add' .domain-wiki/issue-comments.json .domain-wiki/review-comments.json .domain-wiki/reviews.json > .domain-wiki/discussion.json
          else
            printf '[]\n' > .domain-wiki/discussion.json
          fi
      - name: Check AI credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$OPENAI_API_KEY" && -n "$ATLASSIAN_EMAIL" && -n "$ATLASSIAN_API_TOKEN" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Wiki review skipped until secrets are configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare Wiki update for human approval
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 -m domain_wiki.wiki_update_cli
          --repository . --base "$BASE_SHA" --head "$HEAD_SHA"
          --wiki-directory .domain-wiki/wiki
          --seed-directory tools/domain-wiki/wiki-seed
          --pull-request-context .domain-wiki/pr.json
          --discussion .domain-wiki/discussion.json
      - name: Add manual approval instructions
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo
            echo "- 검토 실행 번호: \`${GITHUB_RUN_ID}\`"
            echo "- 이전 커밋: \`${BASE_SHA}\`"
            echo "- 머지 커밋: \`${HEAD_SHA}\`"
          } >> .domain-wiki/output/wiki-comment.md
      - name: Save approval request
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: wiki-approval-${{ github.run_id }}
          path: .domain-wiki/output
          if-no-files-found: error
          retention-days: 30
      - name: Publish Wiki review on the merged PR
        if: ${{ steps.credentials.outputs.configured == 'true' && steps.context.outputs.number != '' }}
        env:
          PR_NUMBER: ${{ steps.context.outputs.number }}
        run: >-
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}"
          --body-file .domain-wiki/output/wiki-comment.md

  apply:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: tools/domain-wiki
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Download the reviewed approval request
        uses: actions/download-artifact@v4
        with:
          name: wiki-approval-${{ inputs.review_run_id }}
          path: .domain-wiki/output
          github-token: ${{ github.token }}
          run-id: ${{ inputs.review_run_id }}
      - name: Clone current Git Wiki
        env:
          REPOSITORY: ${{ github.repository }}
        run: git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.wiki.git" .domain-wiki/wiki
      - name: Apply the exact human-approved update
        run: >-
          python3 -m domain_wiki.wiki_update_cli
          --repository . --base "${{ inputs.base_sha }}" --head "${{ inputs.head_sha }}"
          --wiki-directory .domain-wiki/wiki
          --seed-directory tools/domain-wiki/wiki-seed
          --pull-request-context /dev/null --discussion /dev/null
          --apply-approval .domain-wiki/output/wiki-approval.json
          --approval-digest "${{ inputs.approval_digest }}"
      - name: Commit and push Wiki changes
        working-directory: .domain-wiki/wiki
        shell: bash
        run: |
          if git diff --quiet && [[ -z "$(git status --short)" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "docs: 승인된 dev 머지 결과 반영 (${{ inputs.head_sha }})"
          git push origin HEAD
      - name: Publish applied result on the merged PR
        shell: bash
        run: |
          number="$(jq -r '.pullRequest.number // empty' .domain-wiki/output/wiki-approval.json)"
          if [[ -n "$number" ]]; then
            gh pr comment "$number" --repo "${{ github.repository }}" --body-file .domain-wiki/output/wiki-comment.md
          fi
