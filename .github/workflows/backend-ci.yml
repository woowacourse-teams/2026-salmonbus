name: BACKEND-CI

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'backend/**'
      - 'contract/examples/chat-v1.json'
      - 'contract/*.openapi.json'
      - 'docs/api/chat-websocket-public.md'
      - 'dev/server/api.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'backend/**'
      - 'contract/examples/chat-v1.json'
      - 'contract/*.openapi.json'
      - 'docs/api/chat-websocket-public.md'
      - 'dev/server/api.yml'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-deploy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify deployment hooks and runtime source inputs
        run: bash backend/deploy/rehearsal/run.sh

  backend-build:
    # MongoDB 8.0의 커널 6.19+ 기동 오류(SERVER-121912)를 피해 6.8 커널 러너를 사용한다.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify build environment
        run: bash deploy/verify-build-environment.sh

      - name: Build with Gradle
        run: ./gradlew clean build --continue --no-daemon

      - name: Package and verify actual API and worker revisions
        env:
          REVISION_COMMIT: ${{ github.sha }}
        run: bash deploy/package-revision.sh "$REVISION_COMMIT"

      - name: Publish test report
        if: ${{ !cancelled() && hashFiles('backend/**/build/test-results/*/TEST-*.xml') != '' }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'backend/**/build/test-results/*/TEST-*.xml'
          check_name: 'BE 테스트 결과'
          detailed_summary: true

      - name: Summarize slow test classes
        if: ${{ !cancelled() && hashFiles('backend/**/build/test-results/*/TEST-*.xml') != '' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET
          from collections import defaultdict

          suites = []
          modules = defaultdict(float)
          for path in glob.glob('**/build/test-results/*/TEST-*.xml', recursive=True):
              suite = ET.parse(path).getroot()
              module = path.split('/build/test-results/')[0]
              seconds = float(suite.get('time', 0))
              suites.append((seconds, module, suite.get('name'), int(suite.get('tests', 0))))
              modules[module] += seconds

          print('### 테스트 시간')
          print('Spring 컨텍스트와 컨테이너 시작 시간은 그것을 처음 쓴 클래스에 더해진다.')
          print()
          print('| 모듈 | 클래스 시간 합계(초) |')
          print('|---|---:|')
          for module, seconds in sorted(modules.items(), key=lambda item: -item[1]):
              print(f'| {module} | {seconds:.1f} |')
          print()
          print('| 느린 클래스 | 모듈 | 테스트 수 | 시간(초) |')
          print('|---|---|---:|---:|')
          for seconds, module, name, tests in sorted(suites, reverse=True)[:20]:
              print(f'| {name} | {module} | {tests} | {seconds:.1f} |')
          PY

      - name: Upload test results
        if: ${{ !cancelled() && hashFiles('backend/**/build/test-results/*/TEST-*.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/build/test-results/*/TEST-*.xml
          retention-days: 7
