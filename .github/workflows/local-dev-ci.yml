name: LOCAL-DEV-CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'dev/**'
      - 'compose*.yaml'
      - '.dockerignore'
      - 'backend/**/build.gradle'
      - 'contract/examples/chat-v1.json'
      - 'docs/api/chat-websocket-public.md'
      - 'backend/settings.gradle'
      - 'backend/gradle.properties'
      - 'backend/gradlew'
      - 'backend/gradle/**'
      - 'backend/common/src/main/resources/db/**'
      - 'backend/api-app/src/main/java/com/gustler/backend/api/route/**'
      - 'backend/business/route-catalog/src/main/**'
      - 'backend/integrations/gbis-client/src/main/**'
      - 'backend/worker-app/src/main/java/com/gustler/backend/worker/configuration/RouteGeometryProperties.java'
      - 'backend/worker-app/src/main/java/com/gustler/backend/worker/scheduling/RouteCatalogRefreshScheduler.java'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/pnpm-workspace.yaml'
      - '.github/workflows/local-dev-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-development:
    # MongoDB 8.0은 현재 6.19+ 커널에서 기동하지 않는다(SERVER-121912).
    # 2027-04-17 러너 지원 종료 전 MongoDB 이미지를 갱신하고 최신 ARM 러너로 복귀한다.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    env:
      LOCAL_TEST_BUILDER: salmonbus-local-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.40.0
          cache-binary: false
      - name: Create shared image builder
        run: |
          docker buildx create --name "$LOCAL_TEST_BUILDER" --driver docker-container --driver-opt memory=2g \
            --buildkitd-config dev/docker/buildkitd.toml
      - name: Install geometry check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Verify local Docker development environment
        run: |
          python3 -m unittest discover -s dev/tests -p "test_*.py"
          ./dev/local.sh check
          bash dev/tests/cli-contract.sh
          bash dev/tests/image-lifecycle.sh
          bash dev/tests/smoke-local.sh
      - name: Verify every catalog route geometry and persistence
        run: bash dev/tests/geometry-local.sh
