name: FRONTEND-CI

on:
  push:
    branches: ["dev", "main"]
    paths:
      - "frontend/**"
      - "app/native-map/nativeMapMessages.ts"
      - "app/settings/settingsMessages.ts"
      - "dev/docker/frontend.Dockerfile"
      - "compose*.yaml"
      - ".dockerignore"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches: ["dev", "main"]
    paths:
      - "frontend/**"
      - "app/native-map/nativeMapMessages.ts"
      - "app/settings/settingsMessages.ts"
      - "dev/docker/frontend.Dockerfile"
      - "compose*.yaml"
      - ".dockerignore"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 45 }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.20.0
          runtime: node@24
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build local frontend
        env:
          APP_VERSION: local
        run: pnpm exec webpack --config webpack/webpack.local.cjs --output-path "$RUNNER_TEMP/local-frontend-build"

  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lockfile.outputs.version }}

    steps:
      - name: Checkout lockfile
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: frontend/pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - name: Read Playwright version from lockfile
        id: lockfile
        run: |
          versions=$(sed -n "s/^  '@playwright\/test@\([0-9][0-9.]*\)':$/\1/p" frontend/pnpm-lock.yaml | sort -u)
          if [ "$(printf '%s\n' "$versions" | grep -c .)" -ne 1 ]; then
            echo "::error::pnpm-lock.yaml에서 @playwright/test 버전을 하나로 읽지 못했습니다: $(echo ${versions:-없음})"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

  frontend-e2e:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 45 }}
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host

    env:
      E2E_PROJECTS: ${{ github.event_name == 'pull_request' && '--project=chromium --project=iphone-15' || '' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.20.0
          runtime: node@24
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E tests
        run: pnpm test:e2e $E2E_PROJECTS

      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
