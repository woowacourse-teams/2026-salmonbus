name: FRONTEND-CI

on:
  push:
    branches: ["dev", "main"]
    paths:
      - "frontend/**"
      - "app/native-map/nativeMapMessages.ts"
      - "app/settings/settingsMessages.ts"
      - "dev/docker/frontend.Dockerfile"
      - "compose*.yaml"
      - ".dockerignore"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches: ["dev", "main"]
    paths:
      - "frontend/**"
      - "app/native-map/nativeMapMessages.ts"
      - "app/settings/settingsMessages.ts"
      - "dev/docker/frontend.Dockerfile"
      - "compose*.yaml"
      - ".dockerignore"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 45 }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.20.0
          runtime: node@24
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build local frontend
        env:
          APP_VERSION: local
        run: pnpm exec webpack --config webpack/webpack.local.cjs --output-path "$RUNNER_TEMP/local-frontend-build"

  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lockfile.outputs.version }}

    steps:
      - name: Checkout lockfile
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: frontend/pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - name: Read Playwright version from lockfile
        id: lockfile
        run: |
          versions=$(sed -n "s/^  '@playwright\/test@\([0-9][0-9.]*\)':$/\1/p" frontend/pnpm-lock.yaml | sort -u)
          if [ "$(printf '%s\n' "$versions" | grep -c .)" -ne 1 ]; then
            echo "::error::pnpm-lock.yaml에서 @playwright/test 버전을 하나로 읽지 못했습니다: $(echo ${versions:-없음})"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

  frontend-e2e:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 45 }}
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host

    env:
      E2E_PROJECTS: ${{ github.event_name == 'pull_request' && '--project=chromium --project=iphone-15' || '' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # PR은 base와 PR을 합친 커밋을 받으므로, 부모까지 받아 PR이 바꾼 파일을 HEAD^1과 비교한다.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.20.0
          runtime: node@24
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # mock 라우터 검사는 mock, 그 검사, Playwright 설정, 의존성이 바뀐 PR에서만 돌린다. git diff가 실패하면(종료 코드 128) 바뀐 것으로 보고 돌린다.
      - name: Skip API mock cleanup tests unless mocks, the spec, Playwright config, or dependencies changed
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if git diff --quiet HEAD^1 HEAD -- e2e/fixtures e2e/api-mock-cleanup.spec.ts playwright.config.ts package.json pnpm-lock.yaml; then
            echo "E2E_FILTER=--grep-invert=api-mock-cleanup.spec.ts" >> "$GITHUB_ENV"
          fi

      - name: Run E2E tests
        run: pnpm test:e2e $E2E_PROJECTS $E2E_FILTER

      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
