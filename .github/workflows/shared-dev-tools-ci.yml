name: SHARED-DEV-TOOLS-CI

# paths 필터를 두지 않는다. 필터로 워크플로가 돌지 않으면 필수 체크가 대기 상태로 남는다.
# 잡이 먼저 변경 경로를 보고, 아래 CHANGED_PATH_PATTERNS 밖의 변경이면 검사 단계를 건너뛰고 성공으로 끝난다.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# PR 은 같은 PR 의 앞 실행을 취소한다. push 는 브랜치와 커밋마다 그룹을 나눠, 대기 중인 실행이 새 push 나
# 같은 커밋을 다른 브랜치(dev·main)에 push 한 실행에 밀려 취소되지 않게 한다.
concurrency:
  group: shared-dev-tools-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHANGED_PATH_PATTERNS: >-
    dev/*
    backend/*
    .github/workflows/shared-dev-tools-ci.yml
    .github/scripts/*

jobs:
  shared-dev-tools:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check changed paths
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/changed-paths.sh
      - uses: actions/setup-java@v4
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        with:
          java-version: '21'
          distribution: 'corretto'
      - uses: gradle/actions/setup-gradle@v6
        if: ${{ steps.scope.outputs.relevant == 'true' }}
      - name: Test development deployment tools
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        run: >-
          ./backend/gradlew -p dev/server/tools test testHarnessJar
          --no-daemon --max-workers=1 --console=plain
      - name: Test development database target contract
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        working-directory: backend
        run: >-
          ./gradlew --init-script ../dev/server/data.init :worker-app:sharedDevDataTest
          --no-daemon --max-workers=1 --console=plain
      - name: Test GBIS replay extension
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        working-directory: dev/wiremock-extension
        run: ./gradlew test --no-daemon --max-workers=1 --console=plain
      - name: Test Linux permissions and deployment recovery in an isolated container
        if: ${{ steps.scope.outputs.relevant == 'true' }}
        # serverTest와 같은 linux-root 태그를 기존 TestRunner로 실행한다.
        # AWS 인증정보나 호스트 Docker 소켓은 컨테이너에 전달하지 않는다.
        run: |
          docker run --rm --network none --cpus 1 --memory 512m \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/dev/server/tools/build/libs/shared-dev-tools-tests.jar,target=/tests.jar,readonly" \
            eclipse-temurin:21-jre \
            sh -ec 'ln -s /opt/java/openjdk/bin/java /usr/bin/java; java -Xmx256m -jar /tests.jar'
      # tools test, sharedDevDataTest, GBIS replay extension test 는 backend check 밖이라 실행 수 대조를 여기서 한다.
      # --require 는 결과 XML 이 아예 없는 태스크도 실패로 잡는다.
      - name: Summarize and check test counts
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' }}
        run: >-
          python3 .github/scripts/summarize-test-results.py
          --baseline backend/test-baseline.properties --check --output "$GITHUB_STEP_SUMMARY"
          --require tools.test,worker-app.sharedDevDataTest,wiremock-extension.test
          dev/server/tools backend/worker-app dev/wiremock-extension
