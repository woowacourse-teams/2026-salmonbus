version: 0.2

env:
  shell: bash
  variables:
    # cache.paths 는 셸을 안 거쳐서 $HOME 이 안 풀린다. 그래서 캐시로 담을 경로와
    # Gradle 이 실제로 쓰는 경로를 양쪽에 같은 글자로 적는다.
    # 둘이 어긋나면 캐시가 없는 것처럼 아무 말 없이 그냥 돈다.
    #
    # 기본 자리인 /root/.gradle 을 안 쓴다. 빌드 이미지가 거기에 Gradle 8 계열 배포판을
    # 1.1GB 얹어 두는데 우리는 9.5.1 을 쓴다. 첫 빌드가 1.1GB 를 찍고도
    # gradle-9.5.1-bin.zip 을 내려받은 것으로 확인했다.
    # 그 자리를 캐시에 담으면 S3 로 빌드마다 1.4GB 가 오간다. 여기로 옮기면 277MB 다
    GRADLE_USER_HOME: /root/.gradle-ci

phases:
  install:
    runtime-versions:
      java: corretto21

  pre_build:
    commands:
      - cd "${CODEBUILD_SRC_DIR}/backend"
      - java -version
      - |
        # 캐시를 진짜 썼는지는 이 줄로만 안다.
        # buildspec 에 적어도 CodeBuild 프로젝트에서 캐시를 안 켜면 매번 "없다" 가 찍힌다.
        # 빌드 이미지가 안 쓰는 자리라 여기 있는 것은 전부 되살아난 캐시다.
        # 로컬 캐시는 이 경로를 심볼릭 링크로 걸어 준다. du 는 링크를 안 따라가서
        # -L 이 없으면 126MB 가 들어와 있어도 0B 로 찍힌다. 실제로 재봤다
        for d in wrapper/dists caches/modules-2; do
          if [ -d "$GRADLE_USER_HOME/$d" ]; then
            du -shL "$GRADLE_USER_HOME/$d"
          else
            echo "$GRADLE_USER_HOME/$d 가 없다. 이번 빌드가 다 내려받는다"
          fi
        done
      # post_build 의 지문 계산이 이 넷을 쓴다. 없으면 여기서 알아보게 세운다
      - for c in unzip sha256sum awk find; do command -v "$c" >/dev/null || { echo "$c 가 없다"; exit 1; }; done
      # backend-ci.yml 과 같은 검사다. 멀티모듈로 쪼갠 뒤 루트에 소스가 남으면 조용히 안 돈다
      - test ! -d src

  build:
    commands:
      - cd "${CODEBUILD_SRC_DIR}/backend"
      # CI 와 같은 명령이다. Testcontainers 를 쓰는 35개 클래스와 boot JAR 두 개를 실제로 띄우는
      # 테스트까지 다시 돈다. 프로젝트에 privileged mode 가 켜져 있어야 한다
      - ./gradlew clean build --no-daemon

  post_build:
    commands:
      # 캐시 정리는 성공 확인보다 앞에 둔다. CodeBuild 는 실패한 빌드의 캐시도 올려서,
      # 뒤에 두면 실패한 빌드가 남긴 제어 파일이 그대로 캐시에 들어간다
      - |
        # Gradle 문서가 의존성 캐시를 옮길 때 이 둘은 빼라고 한다.
        # *.lock 은 동시 접근을 막는 파일이고 gc.properties 는 캐시 청소 기준이다.
        # 다른 빌드가 남긴 것이 되살아나면 어긋난다. 지워도 다음 빌드가 다시 만든다.
        #
        # -H 는 명령줄에 준 경로가 심볼릭 링크일 때 그것을 따라간다.
        # 로컬 캐시는 이 경로를 링크로 걸어 주는데, -H 가 없으면 find 가 그 링크를
        # 디렉터리로 안 보고 한 건도 못 찾는다. 실측으로 0건이었다.
        # 건수를 찍는 이유도 같다. 0건이면 조용히 지나가는 대신 로그에 남는다.
        #
        # 세 갈래를 다 다른 문구로 남긴다. 같은 "0건" 으로 보이면 다음에 또 여기를 의심한다.
        # 지웠다 · find 가 실패했다 · 지울 자리가 없다 가 서로 다른 일이다
        CACHE="$GRADLE_USER_HOME/caches/modules-2"
        if [ -d "$CACHE" ]; then
          # 이 자리가 링크인지가 -H 를 붙인 이유다. 캐시 종류에 따라 갈려서 로그로 남긴다
          if [ -L "$CACHE" ]; then echo "캐시가 심볼릭 링크로 걸려 있다"; else echo "캐시가 진짜 디렉터리다"; fi
          # 파이프 끝이 tr 이라 pipefail 이 없으면 find 가 실패해도 0건으로 찍힌다.
          # 그러면 링크 때문에 못 찾은 것과 구분이 안 된다
          set -o pipefail
          # -delete 를 -print 앞에 둔다. 뒤에 두면 지우기가 실패한 것까지 세어서
          # 못 지운 파일이 지운 것으로 찍힌다. find 는 앞이 실패하면 뒤를 안 본다
          if deleted="$(find -H "$CACHE" \
              \( -name '*.lock' -o -name 'gc.properties' \) -delete -print | wc -l | tr -d ' ')"; then
            echo "Gradle 제어 파일 ${deleted}건을 캐시에서 뺐다"
          else
            echo "Gradle 제어 파일을 못 셌다. find 가 실패했다"
          fi
          set +o pipefail
        else
          # 머지 뒤 첫 빌드가 이 경우다. 아무 말도 안 남기면 정리가 돌았는지 알 수 없다
          echo "$CACHE 가 없다. 뺄 제어 파일이 없다"
        fi
      # build 가 실패해도 post_build 는 실행된다. 이 줄이 없으면 깨진 빌드가 배포로 나간다
      - test "$CODEBUILD_BUILD_SUCCEEDING" = "1"
      - cd "${CODEBUILD_SRC_DIR}/backend"
      - |
        set -euo pipefail

        # 재시작 여부는 JAR 지문으로 못 잰다. buildInfo() 가 넣는 build.time 때문에
        # 같은 소스를 다시 빌드해도 JAR SHA-256 이 달라진다. 실측으로 확인했다.
        # 그래서 런타임에 들어가는 소스 파일만 모아 센다.
        # 테스트·문서·프론트만 바뀌면 이 값이 안 변해서 서비스를 안 건드린다
        source_digest() {
          find "$@" -type f -print0 2>/dev/null \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            | sha256sum | cut -d' ' -f1
        }

        COMMON="common/src/main common/build.gradle build.gradle settings.gradle gradle/wrapper/gradle-wrapper.properties"
        API_DIGEST="$(source_digest api-app/src/main api-app/build.gradle $COMMON)"
        WORKER_DIGEST="$(source_digest worker-app/src/main worker-app/build.gradle $COMMON)"

        # build 는 실행 못 하는 -plain.jar 도 같이 만든다. 이름으로 걸러낸다
        API_JAR="$(ls api-app/build/libs/api-app-*.jar | grep -v -- '-plain\.jar$')"
        WORKER_JAR="$(ls worker-app/build/libs/worker-app-*.jar | grep -v -- '-plain\.jar$')"

        # 스키마 정본은 common 한 곳이라 두 앱이 같은 값을 싣는다
        FLYWAY_MAX="$(ls common/src/main/resources/db/migration/V*__*.sql \
          | sed 's#.*/V\([0-9][0-9]*\)__.*#\1#' | sort -n | tail -1)"
        APP_VERSION="$(unzip -p "$API_JAR" META-INF/build-info.properties | sed -n 's/^build.version=//p')"
        JAVA_VERSION="$(java -version 2>&1 | head -1 | sed 's/.*"\(.*\)".*/\1/')"

        pack() {
          local component="$1" jar="$2" digest="$3"
          local out="build/revision/$component"
          rm -rf "$out"; mkdir -p "$out/jars" "$out/scripts" "$out/systemd"
          cp "$jar" "$out/jars/$component-app.jar"
          cp "deploy/appspec-$component.yml" "$out/appspec.yml"
          cp deploy/scripts/*.sh "$out/scripts/"; chmod +x "$out/scripts/"*.sh
          cp "deploy/systemd/salmonbus-$component.service" "$out/systemd/"
          {
            echo "component=$component"
            echo "commit=${CODEBUILD_RESOLVED_SOURCE_VERSION}"
            echo "sourceDigest=$digest"
            echo "artifactSha256=$(sha256sum "$out/jars/$component-app.jar" | cut -d' ' -f1)"
            echo "javaVersion=$JAVA_VERSION"
            echo "appVersion=$APP_VERSION"
            echo "flywayMaxVersion=$FLYWAY_MAX"
            echo "builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$out/release-manifest.txt"
          echo "--- $component ---"; cat "$out/release-manifest.txt"
        }

        pack api    "$API_JAR"    "$API_DIGEST"
        pack worker "$WORKER_JAR" "$WORKER_DIGEST"
      # 비밀 검사는 예행연습이 같은 파일을 돌린다. 한쪽만 고치면 어긋난다
      - bash deploy/verify-revision.sh build/revision

# 캐시가 없으면 빌드마다 배포판 151MB 와 의존성 126MB 를 다시 내려받는다.
# GitHub Actions 는 gradle/actions/setup-gradle 이 이 일을 대신 해 준다
cache:
  paths:
    # Gradle 9.5.1 배포판. gradle-wrapper.properties 의 distributionBase 가
    # GRADLE_USER_HOME 이라 여기로 풀린다
    - '/root/.gradle-ci/wrapper/dists/**/*'
    # 내려받은 의존성. Gradle 자기 것이 쌓이는 caches/9.5.1 은 안 담는다.
    # 이 둘만 되살리고 --offline 으로 clean testClasses 가 통과하는 것을 재봤다
    - '/root/.gradle-ci/caches/modules-2/**/*'

artifacts:
  # secondary-artifacts 만 쓸 때도 CodeBuild 는 최상위 files 를 요구한다.
  # 없으면 YAML 파싱은 되는데 산출물이 안 만들어진다
  files:
    - '**/*'
  base-directory: backend/build/revision
  # CodeDeploy 배포 그룹이 둘이라 revision 도 둘로 낸다.
  # 여기 이름은 CodeBuild 프로젝트의 secondary artifact 식별자와 같아야 한다
  secondary-artifacts:
    ApiRevision:
      base-directory: backend/build/revision/api
      files:
        - '**/*'
    WorkerRevision:
      base-directory: backend/build/revision/worker
      files:
        - '**/*'
