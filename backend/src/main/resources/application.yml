spring:
  application:
    name: backend

  web:
    resources:
      add-mappings: false # API 전용 서버라 정적 리소스를 서빙하지 않는다. 없는 경로가 예외로 올라온다.

  http:
    clients:
      connect-timeout: 3s # Open API 실측: 0.04~0.15초 (2026-08-19, 10회).
      read-timeout: 5s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salmonbus} # 기본값은 compose.yml 과 같다.
    username: ${DB_USERNAME:salmonbus}
    password: ${DB_PASSWORD:salmonbus}

  jpa:
    hibernate:
      ddl-auto: validate # 스키마의 주인은 Flyway 다. Hibernate 는 대조만 한다.

gbis:
  base-url: https://apis.data.go.kr/6410000 # 경기도 버스정보시스템(GBIS) 실시간 조회 API
  service-key: ${GBIS_SERVICE_KEY}  # 공공데이터포털에서 발급받은 Decoding 인증키
  daily-limit: 10000 # 활용신청한 API 하나에 걸리는 하루 한도. 두 노선 90초 수집 실측이 8,194회다.

collection:
  # 기본을 꺼둔 채로 두고 실제로 도는 곳에서만 켠다. 켜면 15초마다 상류로 실호출이 나가는데,
  # 통합 테스트가 컨텍스트를 띄우는 내내 그게 나가면 하루 한도를 테스트가 깎는다.
  # 데모서버에서 COLLECTION_ENABLED=true 로 켠다. 서비스키와 같은 자리에 둔다.
  enabled: ${COLLECTION_ENABLED:false}
  # 노선을 늘리면 하루 호출이 노선당 4,278회씩 는다. 두 노선 8,556회로 한도 10,000회의 86퍼센트이고
  # 세 노선은 12,834회로 넘는다. 늘릴 때는 주기표도 같이 고쳐야 한다. 넘치면 기동 때 오류 로그가 뜬다.
  route-ids:
    - "204000057" # 3330 범계역 - 강남역

# 예보 배치와 라벨 회수 배치. 계수 번들이 없어 도는 배포가 하나도 없으므로 꺼둔 채로 낸다.
# 켜는 것은 배포 행이 선 뒤다. 수집(collection.enabled)과 같은 방식으로 끈다.
forecast:
  enabled: false
  interval: 10s # 예보가 안 붙은 판을 집으러 가는 주기. 수집이 첨두 15초라 그보다 짧게 둔다.
  settlement-interval: 60s # 라벨 회수 주기. 예보와 다른 시계에서 돈다.
  statistics-interval: 6h # 셀 통계 재계산 주기. 관측이 쌓여야 값이 바뀌어서 셋 중 제일 느리다.
  batch-limit: 20 # 한 회차에 예보를 붙일 판의 수.
  # 한 회차에 회수를 시도할 예보 줄 수. 노선당 하루 89만~98만 행이 들어오니 두 노선이면 약 187만 행이다.
  # 60초마다 도니 하루 1,440회, 회차당 1,300행이면 겨우 맞고 여유가 없다. 세 배로 잡았다.
  pending-limit: 3000
  # 한 차량의 뒤 관측을 얼마나 읽나. 첨두 15초 수집이면 400개가 100분치라 지평 12의 중앙 소요 26.5분을 덮는다.
  arrival-limit: 400
