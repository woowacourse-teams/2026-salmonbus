plugins {
    id 'java'
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':forecasting')
    implementation project(':observations')
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-jdbc'
    implementation 'tools.jackson.core:jackson-databind'
    runtimeOnly 'org.postgresql:postgresql'

    testRuntimeOnly project(':common')
    testImplementation 'org.flywaydb:flyway-core'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    mainClass = 'com.gustler.backend.maintenance.MaintenanceApplication'
}

tasks.named('test') {
    useJUnitPlatform()
    def runtimeJar = tasks.named('bootJar').flatMap { it.archiveFile }
    dependsOn tasks.named('bootJar')
    inputs.file(runtimeJar)
        .withPropertyName('maintenanceRuntimeJar')
        .withPathSensitivity(PathSensitivity.NONE)
    doFirst {
        systemProperty 'maintenance.boot.jar', runtimeJar.get().asFile.absolutePath
    }
}
