plugins {
    id 'java-library'
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.57.3')
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:apache5-client'
    implementation 'io.micrometer:micrometer-core'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'tools.jackson.core:jackson-databind'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.springframework.boot:spring-boot-flyway'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
    testImplementation testFixtures(project(':common'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation project(':observations')
    implementation project(':operation-log')
}
