plugins {
    id 'java-library'
}

dependencies {
    implementation 'io.micrometer:micrometer-core'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'tools.jackson.core:jackson-databind'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.springframework.boot:spring-boot-flyway'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
    testImplementation testFixtures(project(':common'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation project(':observations')
    implementation project(':operation-log')
}

// 원자료를 저장소에 넣지 않고 명시한 로컬 번들로만 Python/Java 결과를 대조한다.
tasks.register('verifyAlightingAwareParity', JavaExec) {
    def bundlePath = providers.gradleProperty('alightingBundle')
    def resultPath = providers.gradleProperty('alightingParityOutput')
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gustler.backend.forecasting.infrastructure.bundle.alighting.AlightingAwareParityCheck'
    maxHeapSize = '384m'
    jvmArgs '-XX:ActiveProcessorCount=1'
    doFirst {
        if (!bundlePath.isPresent() || !resultPath.isPresent()) {
            throw new GradleException('-PalightingBundle와 -PalightingParityOutput 절대 경로가 필요하다')
        }
        args bundlePath.get(), resultPath.get()
    }
}

// 실제 관측 이력에서 88/80열을 다시 만들어 원본 저장 표본과 비교한다.
tasks.register('verifyAlightingAwareSourceFeatures', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gustler.backend.forecasting.infrastructure.alighting.AlightingAwareSourceFeatureCheck'
    maxHeapSize = '768m'
    jvmArgs '-XX:ActiveProcessorCount=1'
    doFirst {
        args providers.gradleProperty('alightingSourceFixture').get(), providers.gradleProperty('alightingSourceOutput').get()
    }
}

// 명시한 로컬 원자료만 별도 테스트 DB로 재생하며 운영 DB에 접속하지 않는다.
tasks.register('verifyAlightingAwareWorkerReplay', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gustler.backend.forecasting.support.ConfirmedAlightingAwareWorkerReplay'
    maxHeapSize = '1g'
    jvmArgs '-XX:ActiveProcessorCount=1'
    doFirst {
        def replaySourceSha = providers.exec {
            workingDir rootProject.projectDir
            commandLine 'git', 'rev-parse', 'HEAD'
        }.standardOutput.asText.get().trim()
        def dirty = providers.exec {
            workingDir rootProject.projectDir
            commandLine 'git', 'status', '--porcelain', '--', 'business/forecasting', 'tools/alighting_model'
        }.standardOutput.asText.get().trim()
        if (dirty.isEmpty()) {
            systemProperty 'alighting.replay.code-sha', replaySourceSha
        }
        args providers.gradleProperty('alightingWorkerFixtures').get(), providers.gradleProperty('alightingBundle').get(),
            providers.gradleProperty('alightingWorkerOutput').get()
        if (providers.gradleProperty('alightingWorkerRoute').isPresent()) {
            args providers.gradleProperty('alightingWorkerRoute').get()
        }
    }
}

// 후보 계약 검사와 최종 운영 로더 검사를 구분하며 운영 DB에 적재하지 않는다.
tasks.register('verifyAlightingAwareServingReadiness', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gustler.backend.forecasting.infrastructure.bundle.alighting.AlightingAwareServingReadinessCheck'
    maxHeapSize = '512m'
    jvmArgs '-XX:ActiveProcessorCount=1'
    doFirst {
        args providers.gradleProperty('alightingReadinessMode').get(), providers.gradleProperty('alightingBundle').get(),
            providers.gradleProperty('alightingReadinessOutput').get(), providers.gradleProperty('alightingReleaseId').get()
    }
}
