spring:
  application:
    name: salmonbus-archive
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: "SET TIME ZONE 'UTC'"
      maximum-pool-size: 1
      minimum-idle: 0
      data-source-properties:
        ApplicationName: salmonbus-archive
  flyway:
    enabled: false
archive:
  enabled: ${ARCHIVE_ENABLED:false}
  delete-enabled: ${ARCHIVE_DELETE_ENABLED:false}
  bucket: ${ARCHIVE_BUCKET:techcourse-project-2026}
  prefix: ${ARCHIVE_PREFIX:salmonbus/prod/lake-v2/}
  page-size: ${ARCHIVE_PAGE_SIZE:2000}
  interval: ${ARCHIVE_INTERVAL:1s}
  read-timeout: ${ARCHIVE_READ_TIMEOUT:120s}
  purge-pause: ${ARCHIVE_PURGE_PAUSE:0s}
  # 최근 관측의 줄 단위 이관을 미루는 기준. checkpoint: 옛 예보 경로의 체크포인트 보호선(alighting_history_checkpoint)을 본다.
  # window: 그 표를 보지 않고 history-hold-window보다 최근인 날짜는 이관하지 않는다. worker를 FORECAST_PIPELINE=v2로 바꿀 때 함께 바꾼다.
  history-hold: ${ARCHIVE_HISTORY_HOLD:checkpoint}
  history-hold-window: ${ARCHIVE_HISTORY_HOLD_WINDOW:12h} # worker가 되감는 가장 긴 범위(늘린 되감기 창 12h) 이상으로 둔다
  partition-export:
    enabled: ${ARCHIVE_PARTITION_EXPORT_ENABLED:false}
    drop-enabled: ${ARCHIVE_PARTITION_EXPORT_DROP_ENABLED:false}
    retention-days: ${ARCHIVE_PARTITION_EXPORT_RETENTION_DAYS:3}
    prefix: ${ARCHIVE_PARTITION_EXPORT_PREFIX:salmonbus/prod/lake-v3/}
    interval: ${ARCHIVE_PARTITION_EXPORT_INTERVAL:1h}
    initial-delay: ${ARCHIVE_PARTITION_EXPORT_INITIAL_DELAY:1m}
    page-size: ${ARCHIVE_PARTITION_EXPORT_PAGE_SIZE:2000}
    lock-timeout: ${ARCHIVE_PARTITION_EXPORT_LOCK_TIMEOUT:2s}
  legacy-export:
    enabled: ${ARCHIVE_LEGACY_EXPORT_ENABLED:false}
    prefix: ${ARCHIVE_LEGACY_EXPORT_PREFIX:salmonbus/prod/lake-v3-legacy/}
    interval: ${ARCHIVE_LEGACY_EXPORT_INTERVAL:1m}
    initial-delay: ${ARCHIVE_LEGACY_EXPORT_INITIAL_DELAY:1m}
    page-size: ${ARCHIVE_LEGACY_EXPORT_PAGE_SIZE:2000}
    page-pause: ${ARCHIVE_LEGACY_EXPORT_PAGE_PAUSE:200ms}
    segment-size: ${ARCHIVE_LEGACY_EXPORT_SEGMENT_SIZE:64MB}
    max-rows-per-run: ${ARCHIVE_LEGACY_EXPORT_MAX_ROWS_PER_RUN:2000000}
    max-run-duration: ${ARCHIVE_LEGACY_EXPORT_MAX_RUN_DURATION:10m}
    statement-timeout: ${ARCHIVE_LEGACY_EXPORT_STATEMENT_TIMEOUT:60s}
