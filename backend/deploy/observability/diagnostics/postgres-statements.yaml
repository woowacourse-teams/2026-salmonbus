# OPTIONAL. PostgreSQL 14+ and preloaded pg_stat_statements required.
# query_origin is the representative statement's tag, NOT per-request attribution.
# Shared SQL can aggregate different callers. At most 100 statements are exported.
salmonbus_pg_statement:
  query: |
    SELECT queryid::text AS query_id,
      coalesce(substring(query from '/\* salmonbus:([a-z_.]+) \*/'), 'untagged') AS query_origin,
      calls AS calls_total, total_exec_time / 1000 AS execution_seconds_total,
      rows AS rows_total, shared_blks_read AS blocks_read_total,
      shared_blks_dirtied AS blocks_dirtied_total, shared_blks_written AS blocks_written_total,
      temp_blks_read AS temp_blocks_read_total, temp_blks_written AS temp_blocks_written_total,
      wal_bytes AS wal_bytes_total
    FROM pg_stat_statements
    WHERE dbid=(SELECT oid FROM pg_database WHERE datname=current_database())
      AND userid<>(SELECT oid FROM pg_roles WHERE rolname=current_user)
      AND toplevel
    ORDER BY total_exec_time DESC, queryid LIMIT 100
  metrics:
    - query_id: {usage: LABEL, description: "PostgreSQL normalized query ID, not a request ID"}
    - query_origin: {usage: LABEL, description: "Representative query static tag; shared callers can coalesce"}
    - calls_total: {usage: COUNTER, description: "Statement executions"}
    - execution_seconds_total: {usage: COUNTER, description: "Cumulative server execution time"}
    - rows_total: {usage: COUNTER, description: "Rows retrieved or affected"}
    - blocks_read_total: {usage: COUNTER, description: "Blocks read into PostgreSQL buffers, may come from OS cache"}
    - blocks_dirtied_total: {usage: COUNTER, description: "Blocks dirtied, not physical writes"}
    - blocks_written_total: {usage: COUNTER, description: "Blocks written by statement; background writes excluded"}
    - temp_blocks_read_total: {usage: COUNTER, description: "Temporary blocks read"}
    - temp_blocks_written_total: {usage: COUNTER, description: "Temporary blocks written"}
    - wal_bytes_total: {usage: COUNTER, description: "WAL generated by statement"}

salmonbus_pg_statement_coverage:
  query: |
    SELECT count(*) AS statements,
      greatest(count(*)-100,0) AS not_exported
    FROM pg_stat_statements
    WHERE dbid=(SELECT oid FROM pg_database WHERE datname=current_database())
      AND userid<>(SELECT oid FROM pg_roles WHERE rolname=current_user) AND toplevel
  metrics:
    - statements: {usage: GAUGE, description: "Statements visible to monitoring"}
    - not_exported: {usage: GAUGE, description: "Statements outside bounded top 100 cumulative execution-time selection"}

salmonbus_pg_statement_reset:
  query: |
    SELECT extract(epoch FROM stats_reset) AS timestamp_seconds, dealloc AS evictions_total
    FROM pg_stat_statements_info
  metrics:
    - timestamp_seconds: {usage: GAUGE, description: "Statement statistics reset timestamp"}
    - evictions_total: {usage: COUNTER, description: "Statements evicted; interval attribution may be incomplete"}
