# 테스트 태스크별 기준값이다. 키는 <모듈 디렉터리 이름>.<테스트 태스크 이름>이다.
#
# executed.*      실행된 테스트 수(tests - skipped). 정확히 같아야 한다.
#                 backend 모듈은 각 모듈의 verifyTestCount(check)가, 나머지는 CI 요약 스크립트가 대조한다.
#                 테스트를 더하거나 지우거나 끄거나 옮기면 같은 PR 에서 이 값을 고친다. 그래야 리뷰에서 보인다.
#                 값이 비어 있으면 CI 요약이 이번 수를 보여 주고 대조는 건너뛴다.
# contexts.max.*  Spring 컨텍스트 기동 수(Started ... in, GradleWorkerMain 제외) 상한이다. 넘으면 CI 요약에 경고만 낸다.
# postgres.max.*  PostgreSQL 컨테이너 기동 수 상한이다. 넘으면 CI 요약에 경고만 낸다.
#
# 상한은 모듈마다 공유 PG 1개와 허용 목록의 전용 컨테이너만 뜬다는 전제로 잡았다(build.gradle 의 verifyTestResourceRules).

