plugins {
    id 'java'
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation testFixtures(project(':common'))
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

springBoot {
    buildInfo()
}

tasks.named('test') {
    def apiJar = tasks.named('bootJar').flatMap { it.archiveFile }
    // Worker 프로젝트가 구성된 뒤 실제 Boot JAR 출력 파일을 조회한다.
    def workerJar = providers.provider {
        project(':worker-app').tasks.named('bootJar').get().archiveFile.get()
    }
    dependsOn tasks.named('bootJar'), ':worker-app:bootJar'
    inputs.files(apiJar, workerJar)
        .withPropertyName('runtimeJars')
        .withPathSensitivity(PathSensitivity.NONE)
    doFirst {
        systemProperty 'api.boot.jar', apiJar.get().asFile.absolutePath
        systemProperty 'worker.boot.jar', workerJar.get().asFile.absolutePath
    }
}

// API 실행 경로에 쓰기 업무나 다른 실행 앱이 간접 의존으로 들어오지 않게 확인한다.
tasks.register('verifyRuntimeProjects') {
    doLast {
        def projects = configurations.runtimeClasspath.incoming.resolutionResult.allComponents
            .findAll { it.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier }
            .collect { it.id.projectPath }
            .toSet()
        def expected = [':api-app', ':common'] as Set
        if (projects != expected) {
            throw new GradleException("API runtime project dependencies must be ${expected}, but were ${projects}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyRuntimeProjects')
}
