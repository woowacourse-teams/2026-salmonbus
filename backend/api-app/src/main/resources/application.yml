server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB
  servlet:
    session:
      timeout: 10m # 로그인 중에만 쓰는 임시 세션이다. 로그인 상태는 토큰이 가진다.
      cookie:
        name: __Host-sb_session
        path: /
        http-only: true
        secure: true
        same-site: lax
        max-age: 10m

spring:
  application:
    name: backend-api

  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */10 * * * *"

  web:
    resources:
      add-mappings: false # API 전용 서버라 정적 리소스를 서빙하지 않는다. 없는 경로가 예외로 올라온다.

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salmonbus} # 기본값은 compose.yml 과 같다.
    username: ${DB_USERNAME:salmonbus}
    password: ${DB_PASSWORD:salmonbus}
    hikari:
      data-source-properties:
        ApplicationName: salmonbus-api
        connectTimeout: 10
        socketTimeout: 60
        tcpKeepAlive: true
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate # 스키마의 주인은 Flyway 다. Hibernate 는 대조만 한다.

# API 문서는 명시적으로 local/dev 프로필을 켠 경우에만 제공한다.
springdoc:
  api-docs:
    enabled: false
    path: /api/docs/openapi
  swagger-ui:
    enabled: false
    path: /api/docs/ui
    url: /api/docs/openapi
    supported-submit-methods: []
    disable-swagger-default-url: true
    query-config-enabled: false
    validator-url: none
  paths-to-match:
    - /api/v1/**
    - /api/v2/stations/{stationId}/arrivals
    - /api/v2/routes/{routeId}/geometry
    # 로그인 API 는 auth.enabled=true 일 때만 컨트롤러가 등록되므로 꺼져 있으면 명세에도 없다.
    # 브라우저 이동 경로(/api/auth/{provider}/start, /callback)는 보안 필터가 처리해 명세 대신 contract/auth-v1.md 에 적는다.
    - /api/auth/session
    - /api/auth/refresh
    - /api/auth/logout
    - /api/me
    - /api/me/favorite-groups
    - /api/me/favorite-groups/{groupId}
    - /api/me/favorite-groups/order
    - /api/me/favorite-groups/{groupId}/favorites/{favoriteId}
    - /api/me/favorite-groups/{groupId}/favorites/order
    - /api/me/favorite-selections
    - /api/me/favorites
    - /api/me/sessions
    - /api/me/withdrawal/apple

# 오류 응답에 실어 보낸 requestId 로 서버 로그를 찾을 수 있게 한다.
# 이 줄이 없으면 MDC 에 넣어도 로그 줄에 안 찍혀서, 클라이언트가 받은 ID 로 검색할 것이 없다.
logging:
  pattern:
    correlation: "[${spring.application.name:},%X{requestId:-}] "

auth:
  enabled: ${AUTH_ENABLED:false}
  public-base-url: ${AUTH_PUBLIC_BASE_URL:http://localhost:8080}
  token:
    secret: ${AUTH_TOKEN_SECRET:}
    key-id: k1
    access-ttl: 15m
  refresh-token:
    secret: ${AUTH_REFRESH_TOKEN_SECRET:}
  kakao:
    enabled: ${AUTH_KAKAO_ENABLED:false}
    client-id: ${AUTH_KAKAO_CLIENT_ID:}
    client-secret: ${AUTH_KAKAO_CLIENT_SECRET:}
    issuer: https://kauth.kakao.com
    authorization-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
    admin-key: ${AUTH_KAKAO_ADMIN_KEY:} # 탈퇴한 회원의 카카오 연결을 끊는 데 쓴다.
    unlink-uri: https://kapi.kakao.com/v1/user/unlink
  apple:
    enabled: ${AUTH_APPLE_ENABLED:false}
    client-id: ${AUTH_APPLE_CLIENT_ID:}
    team-id: ${AUTH_APPLE_TEAM_ID:}
    key-id: ${AUTH_APPLE_KEY_ID:}
    private-key-path: ${AUTH_APPLE_PRIVATE_KEY_PATH:}
    scopes: openid
    issuer: https://appleid.apple.com
    authorization-uri: https://appleid.apple.com/auth/authorize
    token-uri: https://appleid.apple.com/auth/token
    jwk-set-uri: https://appleid.apple.com/auth/keys
    revoke-uri: https://appleid.apple.com/auth/revoke

arrivals:
  enabled: ${ARRIVALS_ENABLED:false}
  worker-base-url: ${ARRIVAL_WORKER_BASE_URL:http://127.0.0.1:8081}
  internal-token: ${ARRIVAL_INTERNAL_TOKEN:}
  first-result-wait: 500ms # 사용 가능한 수신이 없을 때만 수집 완료를 기다린다. 0ms로 비활성화 가능.
  first-result-max-waiters: 32

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      # 8080 에 /readyz 를 연다. 배포 검증이 8080 이 트래픽 받을 상태인지 이걸로 본다
      probes:
        add-additional-paths: true
