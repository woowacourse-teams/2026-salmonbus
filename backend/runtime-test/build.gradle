// API·Worker 실행 JAR 을 별도 프로세스로 띄우는 시험만 모은다. 실행 JAR 에 들어가지 않으며 Spring 컨텍스트를 띄우지 않는다.
// 다른 모듈의 시험과 다른 테스트 JVM 에서 돌아 Gradle 병렬 실행에서 겹칠 수 있다.
plugins {
    id 'java'
}

dependencies {
    // BoardFreshnessContractTest 가 보드의 신선도 창 상수를 같은 패키지에서 읽는다.
    testImplementation project(':api-app')
    testImplementation testFixtures(project(':common'))
    testImplementation 'org.springframework.boot:spring-boot'
    testImplementation 'tools.jackson.core:jackson-databind'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'net.bytebuddy:byte-buddy' // 별도 JVM에서 실행하는 선택적 성능 계측 에이전트
    testRuntimeOnly 'org.yaml:snakeyaml'
    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    // 실행 JAR 이 이 환경변수를 물려받는 시험이 있다. 빌드 호스트 값과 무관하게 꺼 둔다.
    environment 'ARRIVALS_ENABLED', 'false'
    environment 'ROUTE_GEOMETRY_ENABLED', 'false'
    // 상세 성능 계측은 명시적으로 요청할 때만 실행한다.
    systemProperty 'arrival.profile', providers.gradleProperty('arrivalProfile').getOrElse('false')
    systemProperty 'arrival.firstResultProfile', providers.gradleProperty('arrivalFirstResultProfile').getOrElse('false')
    // 두 프로젝트가 구성된 뒤 실제 Boot JAR 출력 파일을 조회한다.
    def apiJar = providers.provider {
        project(':api-app').tasks.named('bootJar').get().archiveFile.get()
    }
    def workerJar = providers.provider {
        project(':worker-app').tasks.named('bootJar').get().archiveFile.get()
    }
    dependsOn ':api-app:bootJar', ':worker-app:bootJar'
    inputs.files(apiJar, workerJar)
        .withPropertyName('runtimeJars')
        .withPathSensitivity(PathSensitivity.NONE)
    def geometryRoutesFixture = rootProject.file('../dev/data/routes.json')
    inputs.file(geometryRoutesFixture)
        .withPropertyName('geometryRoutesFixture')
        .withPathSensitivity(PathSensitivity.NONE)
    doFirst {
        systemProperty 'api.boot.jar', apiJar.get().asFile.absolutePath
        systemProperty 'worker.boot.jar', workerJar.get().asFile.absolutePath
        systemProperty 'geometry.routes.fixture', geometryRoutesFixture.absolutePath
    }
}

// 저장한 8노선 형상 원본은 api-app 시험과 함께 쓴다. dev 데이터 도구가 이 경로를 원본으로 기록하므로 옮기지 않는다.
tasks.named('processTestResources') {
    from(rootProject.file('api-app/src/test/resources')) {
        include 'gbis/route-geometry-eight-20261014.json'
    }
}
