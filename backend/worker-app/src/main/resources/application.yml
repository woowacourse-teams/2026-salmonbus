server:
  port: 8081
  address: 127.0.0.1

logging:
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Seoul"

spring:
  application:
    name: backend-worker

  http:
    clients:
      connect-timeout: 3s # Open API 실측: 0.04~0.15초 (2026-08-19, 10회).
      read-timeout: 5s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salmonbus} # 기본값은 compose.yml 과 같다.
    username: ${DB_USERNAME:salmonbus}
    password: ${DB_PASSWORD:salmonbus}
    hikari:
      data-source-properties:
        ApplicationName: salmonbus-worker
      maximum-pool-size: 5 # 수집, 예보 줍기와 노선별 실행 줄, 채점, 파티션 유지가 나눠 쓴다.

  jpa:
    hibernate:
      ddl-auto: validate # 스키마의 주인은 Flyway 다. Hibernate 는 대조만 한다.

gbis:
  base-url: https://apis.data.go.kr/6410000 # 경기도 버스정보시스템(GBIS) 실시간 조회 API
  # 콜론 뒤를 비워 둔다. 환경변수가 없으면 빈 값이 되고 기동이 거기서 막힌다.
  # 콜론이 없으면 안 풀린 자리표시자가 글자 그대로 값이 되는데, 비어 있지 않아서 검사를 통과한다.
  # 그러면 키를 빠뜨린 채로 앱이 멀쩡히 뜨고 호출만 전부 거절당한다.
  service-key: ${GBIS_SERVICE_KEY:}  # 인코딩본과 원래 판본 중 아무거나 넣으면 된다
  service-key-b: ${GBIS_SERVICE_KEY_B:}
  service-key-c: ${GBIS_SERVICE_KEY_C:}
  service-key-d: ${GBIS_SERVICE_KEY_D:}
  daily-limit: 10000 # 활용신청한 API 하나에 걸리는 하루 한도. 두 노선 90초 수집 실측이 8,194회다.

collection:
  # 기본을 꺼둔 채로 두고 실제로 도는 곳에서만 켠다. 켜면 시간대별 주기로 상류에 실호출이 나가는데,
  # 통합 테스트가 컨텍스트를 띄우는 내내 그게 나가면 하루 한도를 테스트가 깎는다.
  # 데모서버에서 COLLECTION_ENABLED=true 로 켠다. 서비스키와 같은 자리에 둔다.
  enabled: ${COLLECTION_ENABLED:false}
  # 노선을 늘리면 하루 호출이 노선당 4,278회씩 는다. 넘치면 기동 때 오류 로그가 뜬다.
  route-ids:
    - "204000057" # 3330
    - "234000050" # 1650
    - "204000070" # 9007
    - "234000886" # 9300
    - "233000392" # 6011
    - "227000038" # 3000
    - "228000184" # 5600
    - "234000051" # 3500
    # 학습용 관측 수집 대상. 모델 번들 지원 노선은 별도로 관리한다.
    - "204000081" # 1151
    - "234000002" # 9000
    - "234000313" # 1500-2
    - "234000878" # 8100
    - "234000882" # 1150
    - "204000082" # G8110
    - "234001739" # 6801
    - "233000266" # 6003
    - "204000170" # 3100
    - "234000879" # 1101
    - "228000393" # 7007-1
    - "200000314" # 4000

# 계수 파일이 든 디렉터리. manifest.json과 그 안에 선언된 모델 파일이 있어야 한다.
# 비워 두면 아무것도 안 읽고 예보 배치가 batch 를 안 연다. 계수가 아직 없는 지금의 정상 상태다.
model:
  bundle:
    directory: ${MODEL_BUNDLE_DIRECTORY:}
    # 도는 배포와 계수 파일의 신원이 다를 때만 본다. 꺼져 있으면 안 올리고 경고만 남긴다.
    # 계수를 갈아 끼우거나 옛 계수로 되돌릴 때 사람이 켠다. 켠 채로 두면 재기동마다 올라간다.
    promote-on-start: ${MODEL_BUNDLE_PROMOTE_ON_START:false}
    # 재생·정산 검증을 실행하지 않았다고 밝힌 합성 번들을 받을지다. 실제 관측 없이 만든 번들이라 저장소의 설정 파일 가운데 로컬 개발
    # 설정만 켠다. 자리표시자는 두지 않았지만 일반 설정 값이라 환경변수 MODEL_BUNDLE_ALLOW_SYNTHETIC_FIXTURE 로도 켜진다. 운영 env 에
    # 넣지 않는다. 켜져 있어도 번들이 합성 표시를 달고 실행하지 않은 검증을 밝힌 경우가 아니면 적재 결과가 달라지지 않는다.
    allow-synthetic-fixture: false

# 정류장 쌍 도보 거리 파일(stop-walk-distances.csv.gz·json)이 든 디렉터리. 계수 파일처럼 사람이 갖다 놓는다.
# 기동할 때 지금 적재된 묶음과 다르면 stop_walk_distance 를 통째로 바꾼다. 비워 두거나 파일이 없으면 건너뛴다.
walking:
  distances:
    directory: ${WALK_DISTANCES_DIRECTORY:}

# 예보와 채점. 계수 번들이 없어 도는 배포가 하나도 없으면 꺼둔 채로 둔다.
# 켜는 것은 배포 행이 선 뒤다. 수집(collection.enabled)과 같은 방식으로 끈다.
forecast:
  enabled: ${FORECAST_ENABLED:false}
  interval: 30s # 수집 신호를 놓쳤거나 처리 중에 멈춘 배치를 다시 줍는 주기. 수신 뒤 90초 안에 착수해야 예보하므로 그보다 짧게 둔다.
  # 수신한 지 이보다 오래된 배치는 줍지 않는다. /board 는 관측 5분이 지난 배치를 쓰지 않으므로 더 오래된 배치는 처리해도 쓸 곳이 없다.
  # 이 창은 api-app BoardFreshnessPolicy.FRESHNESS_WINDOW 이상이어야 한다. 좁히면 그 사이 배치가 처리되지 않아 보드가 고를 최신
  # 예보가 없어진다. 넓히면 오래된 배치가 줍기 한도를 채워 새 배치가 밀린다.
  # 환경변수로는 바꾸지 않는다. 값을 바꾸려면 두 곳을 같이 고치고 계약 테스트를 통과해야 한다.
  staleness: 10m
  batch-limit: 20 # 노선 판본의 처리하지 않은 배치를 한 번에 읽는 수의 상한. 다 찼고 처리를 마친 배치가 있으면 이어서 읽는다
  lanes: ${FORECAST_LANES:2} # 노선별 실행 줄 수. 같은 노선은 항상 같은 줄에서 순서대로 처리한다. 줄 길이가 계속 쌓이면 늘린다
  partition-interval: 1h # 오늘부터 사흘 뒤까지 날짜 파티션을 확인하는 주기. 수집이 켜진 worker는 파티션이 된 관측 테이블도 다룬다

route-geometry:
  generation:
    enabled: ${ROUTE_GEOMETRY_GENERATION_ENABLED:false}
    # The budget is persisted per job; changing this default does not reset existing work.
    max-attempts: ${ROUTE_GEOMETRY_GENERATION_MAX_ATTEMPTS:5}
    poll-delay-ms: 10000
    shadow:
      enabled: ${ROUTE_GEOMETRY_SHADOW_ENABLED:false}
      # Enabled local shadow requires an independently pinned source-only search bundle.
      # bundle-path, bundle-sha256 (decompressed), raw-source-sha256 and model-input-sha256
      # are explicit configuration; no graph paths or authority flags come from model output.
  multi-source:
    enabled: ${ROUTE_GEOMETRY_MULTI_SOURCE_ENABLED:false}
    gg-key: ${GG_DATA_API_KEY:}
    gbis-web-endpoint: ${ROUTE_GEOMETRY_GBIS_WEB_ENDPOINT:https://www.gbis.go.kr/gbis2014/schBusAPI.action}
    bms-node-endpoint: ${ROUTE_GEOMETRY_BMS_NODE_ENDPOINT:https://openapi.gg.go.kr/TBBMSNODEM}
  enabled: ${ROUTE_GEOMETRY_ENABLED:false} # 기동과 매일04시 수집, 기존 BUS_ROUTE 예산 사용
  route-ids: [] # 비어 있으면 collection.route-ids. 별도 지정해도 차량 관측 대상은 늘어나지 않는다.

arrivals:
  enabled: ${ARRIVALS_ENABLED:false}
  internal-token: ${ARRIVAL_INTERNAL_TOKEN:}
  key-daily-limit: 10000
  queue-capacity: 8
  refresh-interval: 40s
  validity: 60s
  retry-base: 40s
  retry-maximum: 300s
  startup-delay: 40s
  queue-wait: 2s
  retention: 10m
  cleanup-interval: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

stations:
  seed:
    enabled: ${STATION_SEED_ENABLED:false}
    path: ${STATION_SEED_PATH:}
    encoding: ${STATION_SEED_ENCODING:UTF-8}
  fill:
    enabled: ${STATION_FILL_ENABLED:false}
    internal-token: ${STATION_INTERNAL_TOKEN:}
    refresh-interval: 30d
    queue-capacity: 64
    idle-interval: 5s
    max-failures: 5
