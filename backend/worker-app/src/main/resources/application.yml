server:
  port: 8081
  address: 127.0.0.1

logging:
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Seoul"

spring:
  application:
    name: backend-worker

  http:
    clients:
      connect-timeout: 3s # Open API 실측: 0.04~0.15초 (2026-08-19, 10회).
      read-timeout: 5s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salmonbus} # 기본값은 compose.yml 과 같다.
    username: ${DB_USERNAME:salmonbus}
    password: ${DB_PASSWORD:salmonbus}
    hikari:
      data-source-properties:
        ApplicationName: salmonbus-worker
      maximum-pool-size: 5 # 수집·예보·정산·통계에 그림자 실행(SAL-434) 스레드가 하나 더 쓴다.

  jpa:
    hibernate:
      ddl-auto: validate # 스키마의 주인은 Flyway 다. Hibernate 는 대조만 한다.

gbis:
  base-url: https://apis.data.go.kr/6410000 # 경기도 버스정보시스템(GBIS) 실시간 조회 API
  # 콜론 뒤를 비워 둔다. 환경변수가 없으면 빈 값이 되고 기동이 거기서 막힌다.
  # 콜론이 없으면 안 풀린 자리표시자가 글자 그대로 값이 되는데, 비어 있지 않아서 검사를 통과한다.
  # 그러면 키를 빠뜨린 채로 앱이 멀쩡히 뜨고 호출만 전부 거절당한다.
  service-key: ${GBIS_SERVICE_KEY:}  # 인코딩본과 원래 판본 중 아무거나 넣으면 된다
  service-key-b: ${GBIS_SERVICE_KEY_B:}
  service-key-c: ${GBIS_SERVICE_KEY_C:}
  service-key-d: ${GBIS_SERVICE_KEY_D:}
  daily-limit: 10000 # 활용신청한 API 하나에 걸리는 하루 한도. 두 노선 90초 수집 실측이 8,194회다.

collection:
  # 기본을 꺼둔 채로 두고 실제로 도는 곳에서만 켠다. 켜면 시간대별 주기로 상류에 실호출이 나가는데,
  # 통합 테스트가 컨텍스트를 띄우는 내내 그게 나가면 하루 한도를 테스트가 깎는다.
  # 데모서버에서 COLLECTION_ENABLED=true 로 켠다. 서비스키와 같은 자리에 둔다.
  enabled: ${COLLECTION_ENABLED:false}
  # 노선을 늘리면 하루 호출이 노선당 4,278회씩 는다. 넘치면 기동 때 오류 로그가 뜬다.
  route-ids:
    - "204000057" # 3330
    - "234000050" # 1650
    - "204000070" # 9007
    - "234000886" # 9300
    - "233000392" # 6011
    - "227000038" # 3000
    - "228000184" # 5600
    - "234000051" # 3500
    # 학습용 관측 수집 대상. 모델 번들 지원 노선은 별도로 관리한다.
    - "204000081" # 1151
    - "234000002" # 9000
    - "234000313" # 1500-2
    - "234000878" # 8100
    - "234000882" # 1150
    - "204000082" # G8110
    - "234001739" # 6801
    - "233000266" # 6003
    - "204000170" # 3100
    - "234000879" # 1101
    - "228000393" # 7007-1
    - "200000314" # 4000
  # 켜면 한 판의 관측을 INSERT 한 문장으로 넣는다(SAL-434). 예약·전송 기록·저장의 세 커밋은 그대로다.
  bulk-insert: ${COLLECTION_BULK_INSERT:false}

# 계수 파일이 든 디렉터리. manifest.json과 그 안에 선언된 모델 파일이 있어야 한다.
# 비워 두면 아무것도 안 읽고 예보 배치가 batch 를 안 연다. 계수가 아직 없는 지금의 정상 상태다.
model:
  bundle:
    directory: ${MODEL_BUNDLE_DIRECTORY:}
    # 도는 배포와 계수 파일의 신원이 다를 때만 본다. 꺼져 있으면 안 올리고 경고만 남긴다.
    # 계수를 갈아 끼우거나 옛 계수로 되돌릴 때 사람이 켠다. 켠 채로 두면 재기동마다 올라간다.
    promote-on-start: ${MODEL_BUNDLE_PROMOTE_ON_START:false}

# 정류장 쌍 도보 거리 파일(stop-walk-distances.csv.gz·json)이 든 디렉터리. 계수 파일처럼 사람이 갖다 놓는다.
# 기동할 때 지금 적재된 묶음과 다르면 stop_walk_distance 를 통째로 바꾼다. 비워 두거나 파일이 없으면 건너뛴다.
walking:
  distances:
    directory: ${WALK_DISTANCES_DIRECTORY:}

# 예보 배치와 라벨 회수 배치. 계수 번들이 없어 도는 배포가 하나도 없으므로 꺼둔 채로 낸다.
# 켜는 것은 배포 행이 선 뒤다. 수집(collection.enabled)과 같은 방식으로 끈다.
forecast:
  enabled: ${FORECAST_ENABLED:false}
  compact-settlement-write: ${FORECAST_COMPACT_SETTLEMENT_WRITE:false}
  interval: 30s # 관측 저장 이벤트를 놓친 batch를 집으러 가는 주기. 늦게 붙은 예보도 정산 라벨 간격 90초 안에 들게 둔다.
  settlement-interval: 60s # 라벨 회수 주기. 예보와 다른 시계에서 돈다.
  # 진행한 회차 뒤에는 실행 시간 × settlement-rest-ratio를 쉬되 settlement-minimum-interval 이상, settlement-interval 이하로 쉰다.
  # 진행이 이어지는 동안 정산 스레드 점유율은 1/(1+비율)이다. 0.25면 80%, 1이면 50%, 3이면 25%다.
  settlement-minimum-interval: ${FORECAST_SETTLEMENT_MINIMUM_INTERVAL:100ms}
  settlement-rest-ratio: ${FORECAST_SETTLEMENT_REST_RATIO:0.25}
  # 이보다 오래된 판에는 예보를 안 붙인다. 앵커가 둘이다.
  # 학습: 회수가 도착 후보를 예보 낸 시각 뒤에서만 찾는데 관측과 90초 넘게 벌어지면 전부 끊김으로 닫힌다.
  # 조회: /board 가 관측 5분이 지난 판을 안 쓴다. 5분 밖은 두 쓸모가 다 없다.
  # 이 창은 api-app BoardFreshnessPolicy.FRESHNESS_WINDOW 이상이어야 한다. 좁히면 그 사이 판이
  # 영영 발행되지 않아 보드가 집을 최신 발행이 없어진다. 넓히면 오래된 판이 회차를 채워 새 판이 밀린다.
  # 환경변수로는 바꾸지 않는다. 값을 바꾸려면 두 곳을 같이 고치고 계약 테스트를 통과해야 한다.
  staleness: 10m
  batch-limit: 20 # 한 회차에 예보를 붙일 판의 수.
  # 한 회차에 회수를 시도할 예보 줄 수. 노선당 하루 89만~98만 행이 들어오니 두 노선이면 약 187만 행이다.
  # 60초마다 도니 하루 1,440회, 회차당 1,300행이면 겨우 맞고 여유가 없다. 세 배로 잡았다.
  pending-limit: 3000
  # 한 차량의 뒤 관측을 얼마나 읽나. 첨두 20초 수집이면 400개가 약 133분치라 지평 12의 중앙 소요 26.5분을 덮는다.
  arrival-limit: 400
  # 새 예보 경로(SAL-434)의 스위치. 기본값은 옛 경로만 도는 지금 상태다.
  # 전환 순서: shadow.enabled=true → scoring=shadow → pipeline=v2 → scoring=v2.
  # forecast.enabled=true에서 받아들이는 조합은 넷이고 나머지는 기동을 멈춘다(RUNBOOK 「SAL-434 전환 절차」의 스위치 조합표).
  # (v1, shadow 꺼짐, off) 기본 / (v1, shadow 켜짐, off|shadow) 그림자 / (v2, shadow) / (v2, v2). v2에서 shadow.enabled는 무시한다.
  # 셋 가운데 하나라도 기본값이 아니면 새 테이블의 날짜 파티션을 기동 때와 partition-interval마다 미리 만든다.
  pipeline: ${FORECAST_PIPELINE:v1} # v1: 옛 경로가 본선. v2: 새 경로가 본선(옛 예보 쓰기·체크포인트 없음)
  shadow:
    enabled: ${FORECAST_SHADOW_ENABLED:false} # v1일 때 새 경로를 옆에서 돌려 대조하고 새 테이블에 쓴다
    queue-capacity: ${FORECAST_SHADOW_QUEUE_CAPACITY:200} # 넘치면 새 배치를 버리고 그 노선의 메모리 상태를 버린다
  # off, shadow, v2. shadow: 새 채점을 쓰고 v1이면 옛 정산과 대조한다. v2: 옛 정산 작업을 돌리지 않는다(pipeline=v2에서만).
  scoring: ${FORECAST_SCORING:off}
  scoring-flush-interval: ${FORECAST_SCORING_FLUSH_INTERVAL:5s} # 채점 결과를 모아 한 트랜잭션으로 쓰는 간격
  scoring-queue-capacity: ${FORECAST_SCORING_QUEUE_CAPACITY:10000} # 넘치면 사건을 버리고 그 노선을 다시 되감는다
  scoring-comparison-interval: ${FORECAST_SCORING_COMPARISON_INTERVAL:10m} # 새 채점과 옛 정산 결과 대조 간격(v1에서만)
  scoring-comparison-delay: ${FORECAST_SCORING_COMPARISON_DELAY:3h} # 수신 뒤 이만큼 지난 배치만 대조한다
  scoring-comparison-batch-limit: 1500 # 대조 한 회차에 읽는 예보 실행 수의 상한
  lanes: ${FORECAST_LANES:2} # 새 경로 본선의 노선별 실행 줄 수. 같은 노선은 항상 같은 줄에서 순서대로 처리한다
  lane-queue-capacity: ${FORECAST_LANE_QUEUE_CAPACITY:1000} # 줄 하나의 길이. 넘치면 넣지 않고 다음 줍기(interval)에 맡긴다
  replay-window: ${FORECAST_REPLAY_WINDOW:6h} # 다시 뜰 때 되감는 관측 범위
  replay-extended-window: ${FORECAST_REPLAY_EXTENDED_WINDOW:12h} # 되감은 상태가 모자랄 때(운행 시작을 못 본 차량, 이력 미완) 한 번 늘려 되감는 범위. 12h를 넘으면 기동하지 않는다
  partition-interval: 1h # 오늘부터 사흘 뒤까지 날짜 파티션을 확인하는 주기. 수집이 켜진 worker는 파티션이 된 관측 테이블도 다룬다

route-geometry:
  generation:
    enabled: ${ROUTE_GEOMETRY_GENERATION_ENABLED:false}
    # The budget is persisted per job; changing this default does not reset existing work.
    max-attempts: ${ROUTE_GEOMETRY_GENERATION_MAX_ATTEMPTS:5}
    poll-delay-ms: 10000
    shadow:
      enabled: ${ROUTE_GEOMETRY_SHADOW_ENABLED:false}
      # Enabled local shadow requires an independently pinned source-only search bundle.
      # bundle-path, bundle-sha256 (decompressed), raw-source-sha256 and model-input-sha256
      # are explicit configuration; no graph paths or authority flags come from model output.
  multi-source:
    enabled: ${ROUTE_GEOMETRY_MULTI_SOURCE_ENABLED:false}
    gg-key: ${GG_DATA_API_KEY:}
    gbis-web-endpoint: ${ROUTE_GEOMETRY_GBIS_WEB_ENDPOINT:https://www.gbis.go.kr/gbis2014/schBusAPI.action}
    bms-node-endpoint: ${ROUTE_GEOMETRY_BMS_NODE_ENDPOINT:https://openapi.gg.go.kr/TBBMSNODEM}
  enabled: ${ROUTE_GEOMETRY_ENABLED:false} # 기동과 매일04시 수집, 기존 BUS_ROUTE 예산 사용
  route-ids: [] # 비어 있으면 collection.route-ids. 별도 지정해도 차량 관측 대상은 늘어나지 않는다.

arrivals:
  enabled: ${ARRIVALS_ENABLED:false}
  internal-token: ${ARRIVAL_INTERNAL_TOKEN:}
  key-daily-limit: 10000
  queue-capacity: 8
  refresh-interval: 40s
  validity: 60s
  retry-base: 40s
  retry-maximum: 300s
  startup-delay: 40s
  queue-wait: 2s
  retention: 10m
  cleanup-interval: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

stations:
  seed:
    enabled: ${STATION_SEED_ENABLED:false}
    path: ${STATION_SEED_PATH:}
    encoding: ${STATION_SEED_ENCODING:UTF-8}
  fill:
    enabled: ${STATION_FILL_ENABLED:false}
    internal-token: ${STATION_INTERNAL_TOKEN:}
    refresh-interval: 30d
    queue-capacity: 64
    idle-interval: 5s
    max-failures: 5
