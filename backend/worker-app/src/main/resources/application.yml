server:
  port: 8081
  address: 127.0.0.1

logging:
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Seoul"

spring:
  application:
    name: backend-worker

  http:
    clients:
      connect-timeout: 3s # Open API 실측: 0.04~0.15초 (2026-08-19, 10회).
      read-timeout: 5s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salmonbus} # 기본값은 compose.yml 과 같다.
    username: ${DB_USERNAME:salmonbus}
    password: ${DB_PASSWORD:salmonbus}
    hikari:
      data-source-properties:
        ApplicationName: salmonbus-worker
      maximum-pool-size: 3

  jpa:
    hibernate:
      ddl-auto: validate # 스키마의 주인은 Flyway 다. Hibernate 는 대조만 한다.

gbis:
  base-url: https://apis.data.go.kr/6410000 # 경기도 버스정보시스템(GBIS) 실시간 조회 API
  # 콜론 뒤를 비워 둔다. 환경변수가 없으면 빈 값이 되고 기동이 거기서 막힌다.
  # 콜론이 없으면 안 풀린 자리표시자가 글자 그대로 값이 되는데, 비어 있지 않아서 검사를 통과한다.
  # 그러면 키를 빠뜨린 채로 앱이 멀쩡히 뜨고 호출만 전부 거절당한다.
  service-key: ${GBIS_SERVICE_KEY:}  # 인코딩본과 원래 판본 중 아무거나 넣으면 된다
  service-key-b: ${GBIS_SERVICE_KEY_B:}
  service-key-c: ${GBIS_SERVICE_KEY_C:}
  service-key-d: ${GBIS_SERVICE_KEY_D:}
  daily-limit: 10000 # 활용신청한 API 하나에 걸리는 하루 한도. 두 노선 90초 수집 실측이 8,194회다.

collection:
  # 기본을 꺼둔 채로 두고 실제로 도는 곳에서만 켠다. 켜면 15초마다 상류로 실호출이 나가는데,
  # 통합 테스트가 컨텍스트를 띄우는 내내 그게 나가면 하루 한도를 테스트가 깎는다.
  # 데모서버에서 COLLECTION_ENABLED=true 로 켠다. 서비스키와 같은 자리에 둔다.
  enabled: ${COLLECTION_ENABLED:false}
  # 노선을 늘리면 하루 호출이 노선당 4,278회씩 는다. 넘치면 기동 때 오류 로그가 뜬다.
  route-ids:
    - "204000057" # 3330
    - "234000050" # 1650
    - "204000070" # 9007
    - "234000886" # 9300
    - "233000392" # 6011
    - "227000038" # 3000
    - "228000184" # 5600
    - "234000051" # 3500
    # 학습용 관측 수집 대상. 모델 번들 지원 노선은 별도로 관리한다.
    - "204000081" # 1151
    - "234000002" # 9000
    - "234000313" # 1500-2
    - "234000878" # 8100
    - "234000882" # 1150
    - "204000082" # G8110
    - "234001739" # 6801
    - "233000266" # 6003
    - "204000170" # 3100
    - "234000879" # 1101
    - "228000393" # 7007-1
    - "200000314" # 4000

# 계수 파일이 든 디렉터리. manifest.json 과 weights.safetensors 둘이 있어야 한다.
# 비워 두면 아무것도 안 읽고 예보 배치가 batch 를 안 연다. 계수가 아직 없는 지금의 정상 상태다.
model:
  bundle:
    directory: ${MODEL_BUNDLE_DIRECTORY:}
    # 도는 배포와 계수 파일의 신원이 다를 때만 본다. 꺼져 있으면 안 올리고 경고만 남긴다.
    # 계수를 갈아 끼우거나 옛 계수로 되돌릴 때 사람이 켠다. 켠 채로 두면 재기동마다 올라간다.
    promote-on-start: ${MODEL_BUNDLE_PROMOTE_ON_START:false}

# 예보 배치와 라벨 회수 배치. 계수 번들이 없어 도는 배포가 하나도 없으므로 꺼둔 채로 낸다.
# 켜는 것은 배포 행이 선 뒤다. 수집(collection.enabled)과 같은 방식으로 끈다.
forecast:
  quality-memory:
    # 단일 worker 전용. 수동 DB 품질 변경 또는 다중 worker 실행 시 끈다.
    enabled: ${FORECAST_QUALITY_MEMORY_ENABLED:false}
    # 관측 수가 아니라 보관할 노선 버전 수다. 초과분은 필요할 때 다시 읽는다.
    max-routes: ${FORECAST_QUALITY_MEMORY_MAX_ROUTES:100}
  evaluation:
    memory-limit: ${FORECAST_EVALUATION_MEMORY_LIMIT:60000}
    recovery-page-limit: ${FORECAST_EVALUATION_RECOVERY_PAGE_LIMIT:3}
    observation-cache:
      # 전후 비교를 통과하기 전까지 기존 조회를 기본값으로 유지한다.
      enabled: ${FORECAST_EVALUATION_OBSERVATION_CACHE_ENABLED:false}
      max-observations: ${FORECAST_EVALUATION_OBSERVATION_CACHE_MAX_OBSERVATIONS:100000}
      retention: ${FORECAST_EVALUATION_OBSERVATION_CACHE_RETENTION:50m}
  archive:
    # 배포 유닛에서만 기본 활성화한다. 로컬과 테스트는 외부 저장소를 사용하지 않는다.
    enabled: ${FORECAST_ARCHIVE_ENABLED:false}
    delete-enabled: ${FORECAST_ARCHIVE_DELETE_ENABLED:false}
    work-directory: ${FORECAST_ARCHIVE_WORK_DIRECTORY:/var/lib/salmonbus/evaluation-archive}
    page-size: ${FORECAST_ARCHIVE_PAGE_SIZE:100}
    max-file-bytes: 1048576
    interval: 5s
    initial-delay: 60s
  same-day-initialization:
    interval: 10s
    retry-interval: 60s
    statement-timeout: 25s # 운영 단일 조회 14.93초 표본에 여유를 둔 초기값. 실행 로그로 재평가한다.
    lock-timeout: 100ms
  enabled: ${FORECAST_ENABLED:false}
  interval: 30s # 관측 저장 이벤트를 놓친 batch를 집으러 가는 주기. 늦게 붙은 예보도 정산 라벨 간격 90초 안에 들게 둔다.
  settlement-interval: 60s # 라벨 회수 주기. 예보와 다른 시계에서 돈다.
  statistics-step-interval: 100ms # 한 번에 한 노선의 작은 처리만 수행한 뒤 스레드를 반환한다.
  statistics-interval: 6h # 셀 통계 재계산 주기. 관측이 쌓여야 값이 바뀌어서 셋 중 제일 느리다.
  # 이보다 오래된 판에는 예보를 안 붙인다. 앵커가 둘이다.
  # 학습: 회수가 도착 후보를 예보 낸 시각 뒤에서만 찾는데 관측과 90초 넘게 벌어지면 전부 끊김으로 닫힌다.
  # 조회: /board 가 관측 5분이 지난 판을 안 쓴다. 5분 밖은 두 쓸모가 다 없다.
  # 이 창은 api-app BoardFreshnessPolicy.FRESHNESS_WINDOW 이상이어야 한다. 좁히면 그 사이 판이
  # 영영 발행되지 않아 보드가 집을 최신 발행이 없어진다. 넓히면 오래된 판이 회차를 채워 새 판이 밀린다.
  # 환경변수로는 바꾸지 않는다. 값을 바꾸려면 두 곳을 같이 고치고 계약 테스트를 통과해야 한다.
  staleness: 10m
  batch-limit: 20 # 한 회차에 예보를 붙일 판의 수.
  # 한 회차에 회수를 시도할 예보 줄 수. 노선당 하루 89만~98만 행이 들어오니 두 노선이면 약 187만 행이다.
  # 60초마다 도니 하루 1,440회, 회차당 1,300행이면 겨우 맞고 여유가 없다. 세 배로 잡았다.
  pending-limit: 3000
  # 한 차량의 뒤 관측을 얼마나 읽나. 첨두 15초 수집이면 400개가 100분치라 지평 12의 중앙 소요 26.5분을 덮는다.
  arrival-limit: 400

route-geometry:
  enabled: ${ROUTE_GEOMETRY_ENABLED:false} # 카탈로그 갱신 후 노선당 1회, 기존 BUS_ROUTE 예산 사용
  route-ids: [] # 비어 있으면 collection.route-ids. 별도 지정해도 차량 관측 대상은 늘어나지 않는다.

arrivals:
  enabled: ${ARRIVALS_ENABLED:false}
  internal-token: ${ARRIVAL_INTERNAL_TOKEN:}
  key-daily-limit: 10000
  queue-capacity: 8
  refresh-interval: 40s
  validity: 60s
  retry-base: 40s
  retry-maximum: 300s
  startup-delay: 40s
  queue-wait: 2s
  retention: 10m
  cleanup-interval: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
