plugins {
    id 'java'
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common')
    implementation project(':route-catalog')
    implementation project(':observations')
    implementation project(':arrivals')
    implementation project(':forecasting')
    implementation project(':api-call-quota')
    implementation project(':gbis-client')
    implementation project(':operation-log')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation testFixtures(project(':common'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    environment = environment.findAll { name, value ->
        !name.startsWith('GBIS_SERVICE_KEY_') && !name.startsWith('GBIS_KEYS')
    }
    // 기능 스위치는 빌드 호스트 환경변수와 무관하게 꺼 둔다. 켜야 하는 시험은 시험 속성으로 켠다.
    environment 'COLLECTION_ENABLED', 'false'
    environment 'FORECAST_ENABLED', 'false'
    environment 'FORECAST_ARCHIVE_ENABLED', 'false'
    environment 'ARRIVALS_ENABLED', 'false'
    environment 'ROUTE_GEOMETRY_ENABLED', 'false'
    environment 'GBIS_SERVICE_KEY', 'fake-service-key-for-test'
    // SharedDevWorkerScheduleTest 가 dev 서버 설정을 상대 경로로 읽는다.
    inputs.file(rootProject.file('../dev/server/worker.yml'))
        .withPropertyName('devWorkerConfig')
        .withPathSensitivity(PathSensitivity.NONE)
}

springBoot {
    buildInfo()
}
