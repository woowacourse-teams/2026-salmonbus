# CI(backend-ci), 운영 CodeBuild(buildspec.yml), dev CodeBuild(dev/server/build.sh)가 모두 이 파일을 읽는다.
# 세 빌드의 조건을 한곳에서 맞추려고 명령줄 대신 여기에 둔다.

# 서로 다른 모듈의 태스크를 겹쳐 돌린다. 테스트 JVM 이 작업자 수만큼 함께 뜨므로 메모리 예산은 작업자 2개 기준으로 잡는다.
org.gradle.parallel=true
org.gradle.workers.max=2

# 이 값은 Gradle 기본값(-Xmx512m -Xms256m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError)을 통째로 대신한다.
# 힙만 두 모듈을 동시에 컴파일하는 몫을 더해 1g 로 올리고 나머지는 기본값을 그대로 적는다.
org.gradle.jvmargs=-Xmx1g -Xms256m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError
